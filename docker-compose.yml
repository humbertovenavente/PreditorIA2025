# Deploy del backend de analisis de tendencias (UI + API + ML) en un solo contenedor.
# En EC2: docker compose up -d --build  ->  app en el puerto 80.
services:
  fashion-trend-app:
    build:
      context: ./fashion_trend_app
    image: preditoria-backend:latest
    container_name: preditoria-backend
    ports:
      - "80:8080"
    environment:
      - PORT=8080
      - SECRET_KEY=${SECRET_KEY:-fashion_trend_2025_guatemala_prod}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
